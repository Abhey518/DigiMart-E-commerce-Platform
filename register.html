<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register — DigiMart</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e0f2f1 100%);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .register-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
    }

    .logo-section {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #0ea5a4, #06b6d4);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 1.5rem;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(14,165,164,0.2);
    }

    .register-container h2 {
      font-weight: 800;
      margin-bottom: 8px;
      color: #0f172a;
      font-size: 1.8rem;
      text-align: center;
    }

    .register-container p {
      color: #64748b;
      text-align: center;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #0f172a;
      font-size: 0.95rem;
    }

    .register-container input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.2s;
      font-family: inherit;
    }

    .register-container input:focus {
      outline: none;
      border-color: #0ea5a4;
      box-shadow: 0 0 0 3px rgba(14,165,164,0.1);
    }

    .btn-register {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0ea5a4, #06b6d4);
      border: none;
      color: white;
      font-weight: 700;
      border-radius: 10px;
      margin-top: 8px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 1.05rem;
      box-shadow: 0 4px 12px rgba(14,165,164,0.2);
    }

    .btn-register:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(14,165,164,0.3);
    }

    .login-link {
      margin-top: 24px;
      text-align: center;
      color: #64748b;
      font-size: 0.95rem;
    }

    .login-link a {
      color: #0ea5a4;
      text-decoration: none;
      font-weight: 600;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .error {
      color: #ef4444;
      font-size: 0.9rem;
      margin-top: 8px;
      text-align: left;
    }

    .info-box {
      background: #f0fdfa;
      border-left: 4px solid #0ea5a4;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 24px;
      text-align: left;
    }

    .info-box p {
      margin: 0;
      font-size: 0.9rem;
      color: #0f172a;
      text-align: left;
    }
  </style>
</head>

<body>
  <div class="register-container">
    <div class="logo-section">
      <div class="logo-icon">DM</div>
      <h2>Create Your Account</h2>
      <p>Join DigiMart and start shopping today</p>
    </div>

    <div class="info-box">
      <p>💡 <strong>Want to sell on DigiMart?</strong> Register as a customer first, then apply to become a seller from your account settings.</p>
    </div>

    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="your.email@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a strong password" required minlength="4">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter your password" required minlength="4">
      </div>

      <p id="errorMsg" class="error"></p>

      <button type="submit" class="btn-register">Create Account</button>
    </form>

    <div class="login-link">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>

  <script>
    function handleRegister(event) {
      event.preventDefault();
      
      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();
      const errorMsg = document.getElementById("errorMsg");

      // Reset error
      errorMsg.textContent = "";

      // Validation
      if (!fullName || !email || !password || !confirmPassword) {
        errorMsg.textContent = "Please fill in all fields.";
        return;
      }

      if (!email.includes("@")) {
        errorMsg.textContent = "Please enter a valid email address.";
        return;
      }

      if (password.length < 4) {
        errorMsg.textContent = "Password must be at least 4 characters.";
        return;
      }

      if (password !== confirmPassword) {
        errorMsg.textContent = "Passwords do not match.";
        return;
      }

      // For demo: Store in localStorage (will be replaced with PHP/MySQL backend)
      const userData = {
        fullName: fullName,
        email: email,
        password: password,
        isSeller: false,
        createdAt: new Date().toISOString()
      };

      // Check if user already exists
      const existingUser = localStorage.getItem(`digimartUser_${email}`);
      if (existingUser) {
        errorMsg.textContent = "An account with this email already exists.";
        return;
      }

      // Save user data
      localStorage.setItem(`digimartUser_${email}`, JSON.stringify(userData));
      
      alert("Registration successful! 🎉\n\nYou can now log in with your credentials.");
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
